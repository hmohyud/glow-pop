<svg xmlns="http://www.w3.org/2000/svg" width="160" height="48" viewBox="0 0 160 48" preserveAspectRatio="none">
  <!-- Solid stacked wave bands (no strokes, no transparent gaps) so nothing
       repeats or bleeds above the divider. Each band is filled down to the
       bottom; the one above paints over the top of the one below. -->
  <path fill="#FF1493" d="M0,10 Q40,-2 80,10 T160,10 V48 H0 Z"/>
  <path fill="#FF8A3D" d="M0,20 Q40,8 80,20 T160,20 V48 H0 Z"/>
  <path fill="#FFC400" d="M0,30 Q40,18 80,30 T160,30 V48 H0 Z"/>
  <path fill="#19C3D0" d="M0,40 Q40,28 80,40 T160,40 V48 H0 Z"/>
</svg>
